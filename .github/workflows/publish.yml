name: 🤖 Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      # Installs vp, the Node pinned in package.json's devEngines, and the npm
      # bundled with it, then the dependencies (`vp install`). Trusted
      # publishing needs npm 11.5.1 or later; Vite+ resolves the pin to the
      # newest Node 24, whose bundled npm is well past that (11.19 in 24.21).
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
          registry-url: https://registry.npmjs.org
      - name: Build
        run: vp run build
      - name: Read version
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "npm_url=https://www.npmjs.com/package/${name}/v/${version}" >> "$GITHUB_OUTPUT"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create and push tag
        run: |
          git tag "${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"
      - name: Publish to npm
        run: npm publish --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" \
            --title "${{ steps.pkg.outputs.tag }}" \
            --notes "📦 [${{ steps.pkg.outputs.tag }} on npm](${{ steps.pkg.outputs.npm_url }})" \
            --generate-notes
