name: 🤖 CI

on:
  push:

jobs:
  zxcc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Chromatic needs full git history to compare against the baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx vp run lint
      - name: Build
        run: npx vp run build
      - name: Node entry point
        run: npx vp run test-node-entry
      - name: Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Don't stream test results here, to save actions minutes
          exitOnceUploaded: true
          # TurboSnap: only snapshot stories whose dependency graph changed.
          # The graph comes from storybook-static/preview-stats.json, which
          # `npm run build-storybook` emits via --stats-json. A commit that
          # touches nothing in it (docs, workflows, build config) is bypassed
          # and bills no snapshots. Requires the `push` trigger above and the
          # full history fetched at checkout.
          onlyChanged: true
