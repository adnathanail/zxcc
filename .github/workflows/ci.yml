name: 🤖 CI

on:
  push:

jobs:
  zxcc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Chromatic needs full git history to compare against the baseline.
          fetch-depth: 0
      # Installs vp, the Node pinned in package.json's devEngines, and npm,
      # then the dependencies (`vp install`), caching the package manager's
      # downloads between runs.
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      # Vite Task's cache, so a task whose inputs haven't changed since an
      # earlier run is replayed rather than rerun. Restored after the install,
      # which can recreate node_modules. The key is unique per run because cache
      # entries are immutable; the restore prefix picks up the newest one. Which
      # tasks still hit is Vite Task's decision, from its own fingerprints, so
      # nothing about the sources goes in the key.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - name: Lint
        run: vp run lint
      - name: Build
        run: vp run build
      - name: Node entry point
        run: vp run test-node-entry
      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
      - name: Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Don't stream test results here, to save actions minutes
          exitOnceUploaded: true
          # TurboSnap: only snapshot stories whose dependency graph changed.
          # The graph comes from storybook-static/preview-stats.json, which
          # `npm run build-storybook` emits via --stats-json. A commit that
          # touches nothing in it (docs, workflows, build config) is bypassed
          # and bills no snapshots. Requires the `push` trigger above and the
          # full history fetched at checkout.
          onlyChanged: true
