name: 🙋 Release

# Run by hand: Actions > Release > Run workflow, choosing patch, minor or major.
# The new version is the latest release tag (vX.Y.Z) bumped by that.
#
# The package's version has to be in package.json when it's published. This
# makes a release commit on top of main that sets it, tags that commit, and
# pushes only the tag: main keeps version 0.0.0. (The release commit is
# reachable from the tag, but isn't on main.)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the tag and create the GitHub release
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check this is main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $REF"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true # release tags aren't on main, so fetch them all

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # `|| true`: before the first release there are no tags, and grep's
          # "no match" status would otherwise fail the step (GitHub runs bash
          # with -e and pipefail).
          latest=$(git tag --list 'v*' --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n 1)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump $BUMP"; exit 1 ;;
          esac
          version="v$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::$version is already tagged"
            exit 1
          fi
          echo "Releasing $version (previous release: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"

      # Installs vp, the Node pinned in package.json's devEngines, and the npm
      # bundled with it, then the dependencies (`vp install`). Trusted
      # publishing needs npm 11.5.1 or later; Vite+ resolves the pin to the
      # newest Node 24, whose bundled npm is well past that (11.19 in 24.21).
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
          registry-url: https://registry.npmjs.org

      - name: Make the release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "${VERSION#v}" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"

      # Check and build what's about to be released, before anything is
      # published or pushed. The build reads the version from package.json, so
      # it has to come after the release commit.
      - name: Lint
        run: vp run lint
      - name: Build
        run: vp run build
      - name: Node entry point
        run: vp run test-node-entry

      - name: Publish to npm
        run: npm publish --access public

      - name: Push the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push origin "refs/tags/$VERSION"

      - name: Create the GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          GH_TOKEN: ${{ github.token }}
        # Release commits aren't on main, so the previous release's tag isn't
        # an ancestor of this one, and GitHub would otherwise skip back to the
        # last tag that is. Tell it where the notes start.
        run: |
          name=$(node -p "require('./package.json').name")
          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION" \
            --notes "📦 [$VERSION on npm](https://www.npmjs.com/package/$name/v/${VERSION#v})" \
            ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
