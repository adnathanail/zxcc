name: 🙋 Start release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version
        id: bump
        run: |
          new_version=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${new_version}" >> "$GITHUB_OUTPUT"
      - name: Commit and push branch
        run: |
          git checkout -b "${{ steps.bump.outputs.branch }}"
          git add package.json package-lock.json
          git commit -m "Release ${{ steps.bump.outputs.version }}"
          git push -u origin "${{ steps.bump.outputs.branch }}"
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh pr create \
            --title "Release ${{ steps.bump.outputs.version }}" \
            --body "Automated release PR. Merging will publish ${{ steps.bump.outputs.version }} to npm and create a GitHub release." \
            --base main \
            --head "${{ steps.bump.outputs.branch }}"
